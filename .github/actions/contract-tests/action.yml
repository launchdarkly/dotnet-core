name: Contract Tests
description: Runs CI for the .NET Server SDK
inputs:
  service_project_file:
    description: 'Path to the contract test service project file.'
    required: true
  service_dll_file:
    description: 'Path where compiled dll will be found.'
    required: true
  token:
    description: 'Github token, used for contract tests'
    required: false
    default: ''
  run_fdv2_tests:
    description: 'Whether to run contract tests from the latest v3 release'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup dotnet build tools
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0

    - name: Restore Workloads
      shell: bash
      run: dotnet workload restore ${{ inputs.service_project_file }}

    - name: Restore Dependencies
      shell: bash
      run: dotnet restore ${{ inputs.service_project_file }}

    - name: Build Contract Tests
      shell: bash
      run: dotnet build -p:Configuration=debug ${{ inputs.service_project_file }}

    - name: Launch Contract Tests
      id: launch-contract-tests
      shell: bash
      run: dotnet ${{ inputs.service_dll_file }} > test-service.log 2>&1 & disown

    - name: Suppression Path
      shell: bash
      run: |
        echo "SUPPRESSION_FILE=$(dirname ./${{ inputs.service_project_file }})/test-supressions.txt" >> $GITHUB_ENV
        echo "SUPPRESSION_FILE_FDV2=$(dirname ./${{ inputs.service_project_file }})/test-supressions-fdv2.txt" >> $GITHUB_ENV

    - name: Run Contract Tests
      uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1.0.2
      with:
        test_service_port: 8000
        extra_params: '-status-timeout=360 -skip-from=${{ env.SUPPRESSION_FILE }}'
        token: ${{ inputs.token }}

    - name: Launch Contract Tests FDv2 Flavor
      if: inputs.run_fdv2_tests == 'true'
      id: launch-contract-tests-fdv2
      shell: bash
      run: dotnet ${{ inputs.service_dll_file }} > test-service.log 2>&1 & disown

    - name: Run Contract Tests FDv2 Flavor
      if: inputs.run_fdv2_tests == 'true'
      uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1
      with:
        test_service_port: 8000
        version: 'v3'
        debug_logging: 'true'
        enable_persistence_tests: 'false'
        extra_params: '-status-timeout=360 -skip-from=${{ env.SUPPRESSION_FILE_FDV2 }}'
        token: ${{ inputs.token }}

    - name: Upload test service log on failure
      if: failure() && inputs.run_fdv2_tests == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: contract-test-service-log-${{ runner.os }}-${{ runner.arch }}
        path: test-service.log
        if-no-files-found: warn
        retention-days: 7
