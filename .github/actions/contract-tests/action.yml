name: Contract Tests
description: Runs CI for the .NET Server SDK
inputs:
  service_project_file:
    description: 'Path to the contract test service project file.'
    required: true
  service_dll_file:
    description: 'Path where compiled dll will be found.'
    required: true
  token:
    description: 'Github token, used for contract tests'
    required: false
    default: ''
  run_fdv2_tests:
    description: 'Whether to run contract tests from the latest v3 release'
    required: false
    default: 'false'
  enable_long_running_tests:
    description: 'Whether to run harness tests that wait on real backoff timing. These add about an hour, so only the nightly enables them.'
    required: false
    default: 'false'
  enable_persistence_tests:
    description: 'Whether to start Redis, DynamoDB and Consul on their default ports and run the persistent store tests.'
    required: false
    default: 'false'
  test_service_port:
    description: 'The port of the contract test service. The default is not 8000, the port that the harness expects DynamoDB on.'
    required: false
    default: '9000'

runs:
  using: composite
  steps:
    - name: Setup dotnet build tools
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0

    - name: Restore Workloads
      shell: bash
      run: dotnet workload restore ${{ inputs.service_project_file }}

    - name: Restore Dependencies
      shell: bash
      run: dotnet restore ${{ inputs.service_project_file }}

    - name: Build Contract Tests
      shell: bash
      run: dotnet build -p:Configuration=debug ${{ inputs.service_project_file }}

    - name: Start Persistent Stores
      if: inputs.enable_persistence_tests == 'true'
      uses: launchdarkly/gh-actions/actions/persistent-stores@persistent-stores-v0
      with:
        redis: true
        dynamodb: true
        consul: true

    - name: Launch Contract Tests
      id: launch-contract-tests
      shell: bash
      run: dotnet ${{ inputs.service_dll_file }} ${{ inputs.test_service_port }} > test-service.log 2>&1 & disown

    - name: Suppression Path
      shell: bash
      run: |
        echo "SUPPRESSION_FILE=$(dirname ./${{ inputs.service_project_file }})/test-supressions.txt" >> $GITHUB_ENV
        echo "SUPPRESSION_FILE_FDV2=$(dirname ./${{ inputs.service_project_file }})/test-supressions-fdv2.txt" >> $GITHUB_ENV

    - name: Run Contract Tests
      uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1
      with:
        test_service_port: ${{ inputs.test_service_port }}
        enable_persistence_tests: ${{ inputs.enable_persistence_tests }}
        # Leave the service up for the FDv2 run that follows.
        stop_service: ${{ inputs.run_fdv2_tests == 'true' && 'false' || 'true' }}
        extra_params: "-status-timeout=360 -skip-from=${{ env.SUPPRESSION_FILE }}${{ inputs.enable_long_running_tests == 'true' && ' -enable-long-running-tests' || '' }}"
        token: ${{ inputs.token }}

    - name: Run Contract Tests FDv2 Flavor
      if: inputs.run_fdv2_tests == 'true'
      uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1
      with:
        test_service_port: ${{ inputs.test_service_port }}
        version: 'v3'
        debug_logging: 'true'
        enable_persistence_tests: ${{ inputs.enable_persistence_tests }}
        extra_params: "-status-timeout=360 -skip-from=${{ env.SUPPRESSION_FILE_FDV2 }}${{ inputs.enable_long_running_tests == 'true' && ' -enable-long-running-tests' || '' }}"
        token: ${{ inputs.token }}

    - name: Upload test service log on failure
      if: failure() && inputs.run_fdv2_tests == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: contract-test-service-log-${{ runner.os }}-${{ runner.arch }}
        path: test-service.log
        if-no-files-found: warn
        retention-days: 7
