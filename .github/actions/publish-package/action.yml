name: Publish Package
description: 'Packs DLLs into unsigned Nuget package and publishes to Nuget.'
inputs:
  project_file:
    description: 'Path to the project file.'
    required: true
  dry_run:
    description: 'Is this a dry run. If so no package will be published.'
    required: true
  nuget_user:
    description: 'nuget.org username used for the trusted-publishing OIDC login.'
    required: true
runs:
  using: composite
  steps:
    - name: Setup dotnet build tools
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: | 
              6.0
              7.0

    - name: Install Workloads
      shell: bash
      run: dotnet workload restore ${{ inputs.project_file }}

    - name: Create Nuget Package
      shell: bash
      run: |
        dotnet restore ${{ inputs.project_file }}
        dotnet pack --no-build --output nupkgs --configuration Release ${{ inputs.project_file }}

    # Login runs even on a dry run so a dry run still validates the OIDC exchange; only the push below is gated.
    - name: NuGet login via trusted publishing (OIDC)
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      with:
        user: ${{ inputs.nuget_user }}

    - name: Publish Package
      if: ${{ inputs.dry_run == 'false' }}
      shell: bash
      run: |
        # Push the package before its symbols: nuget.org rejects a .snupkg with 404 until the
        # matching .nupkg exists. --skip-duplicate keeps re-runs idempotent.
        for pkg in $(find ./nupkgs -name '*.nupkg'); do
          echo "publishing ${pkg}"
          dotnet nuget push "${pkg}" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "published ${pkg}"
        done
        for pkg in $(find ./nupkgs -name '*.snupkg'); do
          echo "publishing ${pkg}"
          dotnet nuget push "${pkg}" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "published ${pkg}"
        done

    - name: Dry Run Publish
      if: ${{ inputs.dry_run == 'true' }}
      shell: bash
      run: |
        echo "This is a dry run and packages are not being published."
        for pkg in $(find ./nupkgs -name '*.nupkg' -o -name '*.snupkg'); do
          echo "detected package ${pkg}"
        done
